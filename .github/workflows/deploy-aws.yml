name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deploys against the same server at once.
concurrency:
  group: deploy-aws-ec2
  cancel-in-progress: false

env:
  APP_DIR: /home/${{ secrets.EC2_USER }}/passportphotoapi

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # SSH is closed to the internet; open port 22 for this runner only.
      - name: Allow SSH from runner
        id: runner_ip
        run: |
          ip=$(curl -fsS https://checkip.amazonaws.com)
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 --cidr "$ip/32"

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          for i in 1 2 3 4 5; do
            ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done

      # .env, venv/ and generated files on the server are left untouched.
      - name: Sync code to EC2
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'venv/' \
            --exclude '.venv/' \
            --exclude '.env' \
            --exclude 'uploads/' \
            --exclude 'results/' \
            --exclude '__pycache__/' \
            -e "ssh -i ~/.ssh/ec2.pem" \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:$APP_DIR/"

      - name: Install dependencies and restart
        run: |
          ssh -i ~/.ssh/ec2.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "bash $APP_DIR/deploy/deploy.sh"

      - name: Revoke SSH from runner
        if: always() && steps.runner_ip.outputs.ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 22 --cidr "${{ steps.runner_ip.outputs.ip }}/32"
